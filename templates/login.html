{% extends "base.html" %}
{% block title %}Sign in · CampusCare{% endblock %}
{% block content %}
<section class="auth-card">
  <div class="auth-icon" aria-hidden="true">C</div>
  <span class="eyebrow">Your campus, in good hands</span>
  <h1 class="h3 fw-bold mt-2">Welcome back</h1>
  <p>Sign in to follow your requests and campus work.</p>
  <form method="post" class="mt-4">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="mb-3"><label class="form-label" for="email">Email address</label><input class="form-control" id="email" name="email" type="email" autocomplete="email" required autofocus></div>
    <div class="mb-3"><div class="d-flex justify-content-between"><label class="form-label" for="password">Password</label><a class="small text-decoration-none" href="{{ url_for('forgot_password') }}">Forgot password?</a></div><input class="form-control" id="password" name="password" type="password" autocomplete="current-password" required></div>
    <button class="btn btn-primary w-100 py-2 mt-2" type="submit">Sign in <span aria-hidden="true">→</span></button>
  </form>
  <div class="auth-divider"><span>New to CampusCare?</span></div>
  <a class="btn btn-outline-primary w-100" href="{{ url_for('register') }}">Create a student account</a>
</section>
{% endblock %}
