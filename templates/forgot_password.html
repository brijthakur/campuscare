{% extends "base.html" %}
{% block title %}Reset password · CampusCare{% endblock %}
{% block content %}
<section class="auth-card">
  <div class="auth-icon" aria-hidden="true">↻</div>
  <span class="eyebrow">Account recovery</span>
  <h1 class="h3 fw-bold mt-2">Reset your password</h1>
  <p>Enter your account email. If it’s registered, we’ll send a secure reset link.</p>
  <form method="post" class="mt-4">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="mb-3"><label class="form-label" for="email">Email address</label><input class="form-control" id="email" name="email" type="email" autocomplete="email" required></div>
    <button class="btn btn-primary w-100 py-2" type="submit">Send reset link</button>
  </form>
  <p class="small mt-4 mb-0 text-center"><a href="{{ url_for('login') }}">Back to sign in</a></p>
</section>
{% endblock %}
