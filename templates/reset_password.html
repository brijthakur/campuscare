{% extends "base.html" %}
{% block title %}Choose a new password · CampusCare{% endblock %}
{% block content %}
<section class="auth-card">
  <div class="auth-icon" aria-hidden="true">C</div>
  <span class="eyebrow">Account recovery</span>
  <h1 class="h3 fw-bold mt-2">Choose a new password</h1>
  <p>Make it strong and unique to keep your account secure.</p>
  <form method="post" class="mt-4">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="mb-3"><label class="form-label" for="password">New password</label><input class="form-control" id="password" name="password" type="password" minlength="8" autocomplete="new-password" required></div>
    <button class="btn btn-primary w-100 py-2" type="submit">Update password</button>
  </form>
</section>
{% endblock %}
